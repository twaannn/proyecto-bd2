name: norteleads-avance2

services:
  db:
    image: mariadb:11.4
    container_name: norteleads_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: norte_leads
      MARIADB_ROOT_PASSWORD: "RootNL_2026*Demo"
      TZ: America/Bogota
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb.cnf:/etc/mysql/conf.d/norteleads.cnf:ro
      - ./sql/esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./sql/triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./sql/datos_prueba.sql:/docker-entrypoint-initdb.d/03_datos.sql:ro
      - ./sql/procedimientos.sql:/docker-entrypoint-initdb.d/04_procedimientos.sql:ro
      - ./sql/funciones.sql:/docker-entrypoint-initdb.d/05_funciones.sql:ro
      - ./sql/vistas.sql:/docker-entrypoint-initdb.d/06_vistas.sql:ro
      - ./sql/seguridad.sql:/docker-entrypoint-initdb.d/07_seguridad.sql:ro
    secrets:
      - clave_cifrado
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: norteleads_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norteleads_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: norte_leads
      DB_USER: consulta_nl
      DB_PASSWORD: "ConsultaNL_2026*Demo"
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
    external: true
    name: proyecto-bd2_mariadb_data

secrets:
  clave_cifrado:
    file: ./secrets/clave_cifrado.txt