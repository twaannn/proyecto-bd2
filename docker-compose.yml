services:
  db:
    image: mariadb:11.4
    container_name: norteleads_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-norte_leads}
      MARIADB_USER: ${DB_USER:-norteleads_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:-norteleads_demo_2026}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_demo_2026}
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: norteleads_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 32M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./app
    container_name: norteleads_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-norte_leads}
      DB_USER: ${DB_USER:-norteleads_app}
      DB_PASSWORD: ${DB_PASSWORD:-norteleads_demo_2026}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
